name: Keyword and Content Research

on:
  workflow_dispatch:
  push:
    branches:
      - feature/content-automation-engine
    paths:
      - '.github/workflows/research-only.yml'
  schedule:
    - cron: "15 12 * * 1,4"

permissions:
  contents: write

jobs:
  collect-research:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Collect source leads
        run: python research_only.py
      - name: Store research reports for ChatGPT review
        if: always()
        run: |
          if [ -f research_reports/latest.md ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add research_reports/latest.md research_reports/latest.json
            if ! git diff --cached --quiet; then
              git commit -m "Update keyword and content research"
              git push
            fi
          fi
      - name: Keep downloadable backup
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: research-results
          path: research_reports/
          if-no-files-found: warn
          retention-days: 30
