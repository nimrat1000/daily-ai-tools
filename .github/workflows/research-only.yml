name: Research Only

on:
  workflow_dispatch:
  schedule:
    - cron: "15 12 * * 1,4"

permissions:
  contents: read

jobs:
  collect-research:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Gather public research leads
        run: python research_only.py
      - name: Save reports to GitHub Actions
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: content-research-report
          path: research_reports/
          if-no-files-found: error
          retention-days: 30
