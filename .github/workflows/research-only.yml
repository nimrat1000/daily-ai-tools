name: Research Only

on:
  workflow_dispatch:
  schedule:
    - cron: "15 12 * * 1,4"

permissions:
  contents: write

jobs:
  collect-research:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Gather public research leads
        run: python research_only.py
      - name: Commit readable research report
        if: always()
        run: |
          if [ -f research_reports/latest.md ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add research_reports/latest.md research_reports/latest.json
            if ! git diff --cached --quiet; then
              git commit -m "Update research leads"
              git push
            fi
          fi
      - name: Save workflow artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: content-research-report
          path: research_reports/
          if-no-files-found: warn
          retention-days: 30
